    PatchedAircraftModelRequest:
      type: object
      properties:
        manufacturer:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          $ref: '#/components/schemas/AircraftModelCategoryEnum'
    PatchedAircraftRequest:
      type: object
      description: Initial usage may be set on create; afterwards counters change
        only through services.
      properties:
        model:
          type: integer
        serial_number:
          type: string
          minLength: 1
          maxLength: 100
        registration:
          type: string
          maxLength: 50
        status:
          $ref: '#/components/schemas/AircraftStatusEnum'
        in_service_date:
          type: string
          format: date
          nullable: true
        flight_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        cycles:
          type: integer
          minimum: 0
    PatchedComponentLifeLimitRequest:
      type: object
      properties:
        component_type:
          type: integer
        limit_type:
          $ref: '#/components/schemas/UsageUnitEnum'
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        warning_threshold_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Remaining life (as % of the limit) at which the limit becomes
            due soon.
    PatchedComponentRequest:
      type: object
      description: Initial usage may be set on create; afterwards counters change
        only through services.
      properties:
        component_type:
          type: integer
        serial_number:
          type: string
          minLength: 1
          maxLength: 100
        in_service_date:
          type: string
          format: date
          nullable: true
        flight_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        cycles:
          type: integer
          minimum: 0
    PatchedComponentTypeRequest:
      type: object
      properties:
        part_number:
          type: string
          minLength: 1
          maxLength: 100
        name:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: '#/components/schemas/ComponentTypeCategoryEnum'
    PatchedInspectionIntervalRequest:
      type: object
      properties:
        task:
          type: integer
        interval_type:
          $ref: '#/components/schemas/UsageUnitEnum'
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        warning_threshold_percent:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Remaining interval (as % of the interval) at which the task
            becomes due soon.
    PatchedMaintenanceProgramRequest:
      type: object
      properties:
        aircraft_model:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
