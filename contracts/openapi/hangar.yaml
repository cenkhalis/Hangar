          type: string
          readOnly: true
        task:
          type: integer
          readOnly: true
        task_code:
          type: string
          readOnly: true
        task_title:
          type: string
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        work_order_item:
          type: integer
          readOnly: true
          nullable: true
        work_order:
          type: integer
          readOnly: true
        performed_at:
          type: string
          format: date-time
          readOnly: true
        performed_by:
          type: string
          readOnly: true
        notes:
          type: string
          readOnly: true
        voided:
          type: boolean
          readOnly: true
        voided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        void_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - aircraft
      - aircraft_serial
      - created_at
      - id
      - kind
      - notes
      - performed_at
      - performed_by
      - task
      - task_code
      - task_title
      - void_reason
      - voided
      - voided_at
      - work_order
      - work_order_item
    TaskStatus:
      type: object
