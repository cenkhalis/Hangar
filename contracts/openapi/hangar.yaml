          - $ref: '#/components/schemas/LastCompletion'
          nullable: true
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/IntervalStatus'
      required:
      - code
      - intervals
      - last_completion
      - state
      - task
      - title
    UsageUnitEnum:
      enum:
