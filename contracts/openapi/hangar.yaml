      - cycles
      - calendar_days
      type: string
      description: |-
        * `flight_hours` - Flight hours
        * `cycles` - Cycles
        * `calendar_days` - Calendar days
    WorkOrder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        aircraft:
          type: integer
          readOnly: true
        aircraft_serial:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        notes:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/WorkOrderStatusEnum'
          readOnly: true
        opened_at:
          type: string
          format: date-time
          readOnly: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancel_reason:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderItem'
          readOnly: true
      required:
      - aircraft
      - aircraft_serial
      - cancel_reason
      - closed_at
      - id
      - items
      - notes
      - opened_at
      - status
      - title
    WorkOrderCreateRequest:
      type: object
      properties:
        aircraft:
          type: integer
        tasks:
          type: array
          items:
            type: integer
        title:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
          default: ''
        opened_at:
          type: string
          format: date-time
      required:
      - aircraft
      - tasks
      - title
    WorkOrderItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        work_order:
          type: integer
        task:
          type: integer
        task_code:
          type: string
          readOnly: true
        task_title:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/WorkOrderItemStatusEnum'
        completion:
          type: integer
          nullable: true
          readOnly: true
      required:
      - completion
      - id
      - status
      - task
      - task_code
      - task_title
      - work_order
    WorkOrderItemRequest:
      type: object
      properties:
        work_order:
          type: integer
        task:
          type: integer
        status:
          $ref: '#/components/schemas/WorkOrderItemStatusEnum'
      required:
      - task
      - work_order
    WorkOrderItemStatusEnum:
      enum:
      - pending
      - signed_off
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `signed_off` - Signed off
        * `cancelled` - Cancelled
    WorkOrderRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
      required:
      - title
    WorkOrderStatusEnum:
      enum:
      - open
      - completed
      - cancelled
      type: string
      description: |-
        * `open` - Open
        * `completed` - Completed
        * `cancelled` - Cancelled
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
